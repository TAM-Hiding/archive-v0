name: Archive verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: archive-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/archive-reports"
          python -m venv "$RUNNER_TEMP/archive-venv"
          set -o pipefail
          "$RUNNER_TEMP/archive-venv/bin/python" -m pip install -r requirements-dev.lock 2>&1 | tee "$RUNNER_TEMP/archive-reports/install.txt"
      - name: Verify isolated source
        env:
          PYTHON_BIN: ${{ runner.temp }}/archive-venv/bin/python
        run: bash scripts/verify.sh "$RUNNER_TEMP/archive-reports"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/archive-reports/
          retention-days: 14
          if-no-files-found: warn
