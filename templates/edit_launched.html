<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit launched - The Archive™</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #f0f0f0;
            padding: 2rem;
            line-height: 1.5;
        }

        h1 {
            color: #ffd166;
        }

        a {
            color: #7bdff2;
        }

        .path {
            color: #aaa;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='archive.css') }}">
</head>
<body>
    <div class="container">
    <div class="button-row">
        {% include "partials/back_menu.html" %}
        <a href="/note/{{ note.id }}" class="button-secondary">Back to Note</a>
    </div>

    <h1>Editor Launched</h1>

    <p>You should now have <strong>gedit</strong> open for:</p>
    <p class="path">{{ note.path }}</p>

    <p>After saving your changes, go back and click <strong>Reload</strong> in The Archive™.</p>

    </div>
</body>
</html>
